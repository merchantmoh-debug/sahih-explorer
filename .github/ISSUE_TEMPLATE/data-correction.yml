name: Data correction
description: Report a wrong narrator, chain, text, translation, reference or date.
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping correct the data. Corrections go into the source files in `data/source/`, and every build checks them (see DATA.md).
        Please say where the correction comes from, so it can be checked.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the hadith or narrator page. The "Report an error" link fills this in.
      placeholder: https://sahih-explorer.vercel.app/en/bukhari/1
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - A narrator in the chain is the wrong person
        - A narrator's grade, generation, dates or places
        - Teachers, students or family
        - Arabic text
        - English translation
        - Reference number or published grading
        - A chain note
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What the page shows, and what it should show instead.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Book, edition and page, or a link, that supports the correction.
    validations:
      required: true
