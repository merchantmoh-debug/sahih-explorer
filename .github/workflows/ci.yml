name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Builds data/build from data/source and fails on any integrity check.
      - run: npm run data:build

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke test
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/en && break
            sleep 1
          done
          node scripts/smoke.mjs http://localhost:3000

      - name: Server log
        if: failure()
        run: cat server.log || true
